name: Refresh ScriptBlox Feed

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Max pages for this run"
        required: false
        default: "150"
      delay_ms:
        description: "Delay between page pulls (ms)"
        required: false
        default: "1800"
      target_pages:
        description: "Target visible pages to maintain"
        required: false
        default: "800"

permissions:
  contents: write

concurrency:
  group: refresh-scriptblox-feed
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Debug context
        shell: bash
        run: |
          echo "repo=${{ github.repository }}"
          echo "ref=${{ github.ref_name }}"
          pwd
          ls -la

      - name: Normalize moderation settings
        shell: pwsh
        run: |
          $settingsPath = "./moderation/settings.json"
          $settings = $null
          if (Test-Path $settingsPath) {
            try {
              $settings = Get-Content $settingsPath -Raw | ConvertFrom-Json
            } catch {
              $settings = $null
            }
          }
          if (-not $settings) {
            $settings = [pscustomobject]@{
              max_posts_per_window = 2
              max_user_posts_per_window = 2
              max_new_posts_per_author_per_run = 2
              max_stale_validations_per_run = 120
              unresolved_new_post_quarantine_minutes = 60
              window_minutes = 10
            }
          }
          $settings.max_posts_per_window = 2
          $settings.max_user_posts_per_window = 2
          $settings.max_new_posts_per_author_per_run = 2
          $settings.max_stale_validations_per_run = 120
          $settings.unresolved_new_post_quarantine_minutes = 60
          $settings | ConvertTo-Json -Depth 5 | Set-Content -Path $settingsPath -Encoding utf8

      - name: Refresh feed
        shell: pwsh
        run: |
          $maxPages = "${{ github.event.inputs.max_pages }}"
          if (-not $maxPages) { $maxPages = "150" }
          if ([int]$maxPages -lt 40) { $maxPages = "40" }
          $delayMs = "${{ github.event.inputs.delay_ms }}"
          if (-not $delayMs) { $delayMs = "1800" }
          $targetPages = "${{ github.event.inputs.target_pages }}"
          if (-not $targetPages) { $targetPages = "800" }
          if ([int]$targetPages -lt 1) { $targetPages = "400" }
          $targetScripts = [int]$targetPages * 24

          $rollingCount = 0
          if (Test-Path "./scriptblox-rolling-cache.json") {
            try {
              $rolling = Get-Content "./scriptblox-rolling-cache.json" -Raw | ConvertFrom-Json
              if ($rolling.count) { $rollingCount = [int]$rolling.count }
              elseif ($rolling.scripts) { $rollingCount = @($rolling.scripts).Count }
            } catch {
              $rollingCount = 0
            }
          }
          if ($rollingCount -lt $targetScripts) {
            Write-Host ("Bootstrap mode active: rolling cache {0}/{1}. Keeping MaxPages={2}, DelayMs={3}" -f $rollingCount, $targetScripts, $maxPages, $delayMs)
          } else {
            Write-Host ("Maintenance mode: rolling cache {0}/{1}" -f $rollingCount, $targetScripts)
          }

          if (-not (Test-Path "./refresh-scriptblox-feed.ps1")) {
            Write-Warning "refresh-scriptblox-feed.ps1 not found; skipping run."
            exit 0
          }

          pwsh -NoProfile -File ./refresh-scriptblox-feed.ps1 `
            -Force `
            -MaxPages ([int]$maxPages) `
            -DelayMs ([int]$delayMs) `
            -MaxDetailLookupsPerRun 6 `
            -DetailDelayMs 1500 `
            -MinIntervalMinutes 10 `
            -BlacklistOwnerPages 2 `
            -BlacklistOwnerDelayMs 900 `
            -MinimumKeepRatio 35 `
            -RetentionDays 60 `
            -MaxVisibleScripts $targetScripts

          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Refresh script exited with code $LASTEXITCODE. Retrying once after 5 minutes."
            Start-Sleep -Seconds 300
            pwsh -NoProfile -File ./refresh-scriptblox-feed.ps1 `
              -Force `
              -MaxPages ([int]$maxPages) `
              -DelayMs ([int]$delayMs) `
              -MaxDetailLookupsPerRun 6 `
              -DetailDelayMs 1500 `
              -MinIntervalMinutes 10 `
              -BlacklistOwnerPages 2 `
              -BlacklistOwnerDelayMs 900 `
              -MinimumKeepRatio 35 `
              -RetentionDays 60 `
              -MaxVisibleScripts $targetScripts

            if ($LASTEXITCODE -ne 0) {
              Write-Warning "Retry failed. Keeping previous feed files."
              exit 0
            }
          }

      - name: Validate feed freshness
        shell: pwsh
        run: |
          $feedPath = "./scriptblox-feed.json"
          if (-not (Test-Path $feedPath)) {
            Write-Warning "scriptblox-feed.json not found after refresh."
            exit 1
          }
          try {
            $feed = Get-Content $feedPath -Raw | ConvertFrom-Json
          } catch {
            Write-Warning "Failed to parse scriptblox-feed.json."
            exit 1
          }
          $stamp = $feed.generatedAt
          if (-not $stamp) {
            Write-Warning "generatedAt missing from scriptblox-feed.json."
            exit 1
          }
          try {
            $ts = [datetime]::Parse($stamp).ToUniversalTime()
          } catch {
            Write-Warning "generatedAt is not a valid timestamp: $stamp"
            exit 1
          }
          $age = (Get-Date).ToUniversalTime() - $ts
          if ($age.TotalMinutes -gt 120) {
            Write-Warning ("Feed is stale ({0:N0} minutes old). Failing run to avoid committing stale data." -f $age.TotalMinutes)
            exit 1
          }
          Write-Host ("Feed freshness OK: {0:N0} minutes old." -f $age.TotalMinutes)

      - name: Commit updated feed files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for f in scriptblox-feed.json scriptblox-feed.js scriptblox-owner-cache.json scriptblox-refresh-state.json scriptblox-rolling-cache.json moderation/auto-blacklist-titles.txt moderation/auto-blacklist-log.jsonl; do
            if [ -f "$f" ]; then
              git add "$f"
            fi
          done

          if git diff --cached --quiet; then
            echo "No feed changes to commit."
            exit 0
          fi

          git commit -m "chore: auto-refresh ScriptBlox feed"
          if ! git push; then
            echo "Push failed; attempting rebase + retry."
            if ! git pull --rebase --autostash origin "${GITHUB_REF_NAME}"; then
              echo "Rebase failed; skipping push to avoid failing the run."
              git rebase --abort || true
              exit 0
            fi
            if ! git push; then
              echo "Push failed after retry; skipping to avoid failing the run."
              exit 0
            fi
          fi
